name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The ruleset tests need a real rumdl; pin it so CI measures one version.
      - name: Install rumdl
        run: pipx install rumdl==0.2.79

      - name: Run capability test suite
        run: python3 -m unittest discover -s tests -v
